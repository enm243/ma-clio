<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen in-car launcher. Left rail (bottom bar on narrow screens), panels that scroll inside,
   a tilted top-view car on a lit floor as the centrepiece. Dark "instrument night" first, daylight variant. */
:root{
  color-scheme: dark;
  --bg:#090d12; --bg2:#0d131a; --panel:#121922; --panel2:#18212c; --line:#232e3c;
  --fg:#e9eef4; --muted:#8b98aa; --faint:#5d6a7c;
  --accent:#ff9b3d; --accent-soft:rgba(255,155,61,.14); --on-accent:#1c0f02;
  --ok:#46d48f; --warn:#ffd24d; --crit:#ff5c62; --info:#80b4ff;
  --scrim:rgba(3,6,9,.62); --grid:rgba(140,165,195,.10); --shadow:#000;
  --interior:#06080b; --seat:#1a1e24; --bay:#0a0c0f; --metal:#2b3138; --metal2:#3b434c;
  --glass1:#0a1018; --glass2:#2a3d52; --lamp:#f2f8ff; --lampglow:rgba(190,225,255,.8); --tail:#d81f2a;
  --font-display:"Saira Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-label:"Saira","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#e8ecf1; --bg2:#f1f4f7; --panel:#ffffff; --panel2:#f2f5f8; --line:#d4dbe4;
    --fg:#10161e; --muted:#566274; --faint:#8592a4;
    --accent:#cf6600; --accent-soft:rgba(207,102,0,.11); --on-accent:#ffffff;
    --ok:#138f57; --warn:#a37200; --crit:#cc2c33; --info:#2b6ad4;
    --scrim:rgba(20,28,40,.45); --grid:rgba(40,60,90,.10); --shadow:#1a2433;
    --interior:#15181d; --seat:#2a2f36; --bay:#1d2126; --metal:#3a4149; --metal2:#4c555f;
    --lampglow:rgba(255,255,255,.6);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#e8ecf1; --bg2:#f1f4f7; --panel:#ffffff; --panel2:#f2f5f8; --line:#d4dbe4;
  --fg:#10161e; --muted:#566274; --faint:#8592a4;
  --accent:#cf6600; --accent-soft:rgba(207,102,0,.11); --on-accent:#ffffff;
  --ok:#138f57; --warn:#a37200; --crit:#cc2c33; --info:#2b6ad4;
  --scrim:rgba(20,28,40,.45); --grid:rgba(40,60,90,.10); --shadow:#1a2433;
  --interior:#15181d; --seat:#2a2f36; --bay:#1d2126; --metal:#3a4149; --metal2:#4c555f;
  --lampglow:rgba(255,255,255,.6);
}
:root[data-theme="dark"]{ color-scheme: dark; }

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%; margin:0; overflow:hidden;
  background:
    radial-gradient(80% 60% at 85% -10%, var(--accent-soft), transparent 70%),
    var(--bg);
  color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:66px minmax(0,1fr);gap:16px;padding-block:12px}
.rail{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;
  background:var(--panel);border:1px solid var(--line);border-radius:22px;min-height:0;overflow:auto;
}
.rail-mark{
  font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.2em;
  color:var(--accent);padding:4px 0 8px 3px;
}
.rail button{
  width:48px;min-height:46px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--muted);flex-shrink:0;
  transition:background .2s,color .2s;
}
.rail button:hover{color:var(--fg);background:var(--panel2)}
.rail button[aria-current="page"]{color:var(--on-accent);background:var(--accent);box-shadow:0 8px 20px -10px var(--accent)}
.rail svg{width:22px;height:22px}
.rail .rl{display:none;font-size:10px;font-weight:600;letter-spacing:.02em}

.main{min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.view{display:flex;flex-direction:column;gap:14px;min-height:100%;padding-bottom:6px}

.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.vhead > div{min-width:0}
.eyebrow{
  margin:0 0 2px;font-family:var(--font-label);font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
}
.vhead h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1;letter-spacing:.01em;text-wrap:balance}
.vhead .sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.clock{font-family:var(--font-display);font-weight:500;font-size:46px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--fg);opacity:.85;letter-spacing:.01em}

/* ---------- status colors ---------- */
.s-ok{--c:var(--ok)} .s-soon{--c:var(--warn)} .s-over{--c:var(--crit)}
.s-unknown{--c:var(--muted)} .s-unknownhi{--c:var(--warn)}
.pill{
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  font-family:var(--font-label);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;color:var(--c);
  background:var(--panel2);background:color-mix(in srgb, var(--c) 15%, transparent);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block;flex-shrink:0;box-shadow:0 0 8px var(--c)}

/* ---------- home ---------- */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:16px;flex:1}
.home-left{display:flex;flex-direction:column;gap:10px;min-width:0}
.home-right{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:230px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{
  display:flex;flex-direction:column;gap:3px;padding:12px 14px 13px;min-width:0;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;transition:border-color .2s, transform .15s;
}
.tile:hover{border-color:var(--faint)}
.tile:active{transform:scale(.985)}
.tlabel{font-family:var(--font-label);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tval{font-family:var(--font-display);font-weight:600;font-size:29px;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tval small{font-size:15px;font-weight:500;color:var(--muted);margin-left:5px}
.tval.accent{color:var(--accent)}
.tval.c{color:var(--c)}
.tval.dim{color:var(--faint)}
.tmeta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.tmeta.accent{color:var(--accent)}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{
  display:grid;grid-template-columns:4px 34px minmax(0,1fr) auto;align-items:center;gap:12px;
  padding:9px 14px 9px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;width:100%;
}
.alert .stripe{align-self:stretch;background:var(--c)}
.ai,.mi{display:grid;place-items:center;border-radius:11px;background:var(--panel2);color:var(--c)}
.ai{width:34px;height:34px}
.ai svg{width:19px;height:19px}
.alert b{display:block;font-weight:600;font-size:14px;line-height:1.25}
.alert small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}

.stage-cap{margin:0;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding:0 4px}
.stage-cap .l{display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:500}

/* ---------- car stage ---------- */
.stage{
  position:relative;flex:1;min-height:210px;border-radius:22px;overflow:hidden;
  background:radial-gradient(90% 85% at 50% 58%, var(--panel2), var(--bg2) 75%);
  border:1px solid var(--line);perspective:1100px;touch-action:pan-y;cursor:grab;
  -webkit-user-select:none;user-select:none;
}
.stage.dragging{cursor:grabbing}
.car-wrap{
  position:absolute;inset:0;display:grid;place-items:center;transform-style:preserve-3d;
  --rx:44deg;
  transform:rotateX(var(--rx)) rotateZ(var(--rz,-20deg)) scale(1.04);
  transition:transform .9s cubic-bezier(.2,.75,.2,1);
}
.stage.flat .car-wrap{--rx:0deg}
.stage.dragging .car-wrap{transition:none}
.floor{
  position:absolute;width:170%;height:170%;left:-35%;top:-35%;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:36px 36px;background-position:center;
  -webkit-mask-image:radial-gradient(closest-side, #000 30%, transparent 92%);
          mask-image:radial-gradient(closest-side, #000 30%, transparent 92%);
}
.stage.flat .floor{opacity:.5}
svg.car{position:relative;width:96%;height:auto;max-width:none;overflow:visible;display:block}
.stage.flat svg.car{width:auto;height:94%;max-width:96%}
.stage-ui{position:absolute;top:10px;right:10px;z-index:2}
.stage-hint{position:absolute;left:14px;bottom:10px;margin:0;font-size:11.5px;color:var(--faint);pointer-events:none}

/* car parts */
svg.car .pd{stop-color:var(--paint);stop-color:color-mix(in srgb, var(--paint) 52%, #000)}
svg.car .pm{stop-color:var(--paint);stop-color:color-mix(in srgb, var(--paint) 86%, #000)}
svg.car .pl{stop-color:var(--paint);stop-color:color-mix(in srgb, var(--paint) 80%, #fff)}
svg.car .pr{stop-color:var(--paint);stop-color:color-mix(in srgb, var(--paint) 70%, #fff)}
svg.car .g1{stop-color:var(--glass1)} svg.car .g2{stop-color:var(--glass2)}
svg.car .sh0{stop-color:var(--shadow);stop-opacity:.85} svg.car .sh1{stop-color:var(--shadow);stop-opacity:.32} svg.car .sh2{stop-color:var(--shadow);stop-opacity:0}
svg.car .tire{fill:#0b0c0e}
svg.car .body-out{fill:none;stroke:rgba(255,255,255,.10);stroke-width:1}
svg.car .seam{fill:none;stroke:rgba(0,0,0,.42);stroke-width:1.1}
svg.car .seam-hi{fill:none;stroke:rgba(255,255,255,.12);stroke-width:.8}
svg.car .handle{fill:rgba(0,0,0,.38)}
svg.car .crease{fill:none;stroke:rgba(255,255,255,.12);stroke-width:1.2}
svg.car .crease-d{fill:none;stroke:rgba(0,0,0,.22);stroke-width:1.2}
svg.car .sheen{fill:rgba(255,255,255,.07)}
svg.car .wiper{fill:none;stroke:rgba(0,0,0,.6);stroke-width:2;stroke-linecap:round}
svg.car .lamp{fill:var(--lamp);filter:drop-shadow(0 0 5px var(--lampglow))}
svg.car .tail{fill:var(--tail);filter:drop-shadow(0 0 4px rgba(255,40,50,.55))}
svg.car .ap-in{fill:var(--interior)}
svg.car .ap-seat{fill:var(--seat)}
svg.car .ap-glow{fill:var(--accent);opacity:.22}
svg.car .ap-line{fill:none;stroke:var(--seat);stroke-width:2}
svg.car .metal{fill:var(--metal)} svg.car .metal2{fill:var(--metal2)}
svg.car .cap-oil{fill:#e9b821} svg.car .cap-blue{fill:#3b7fd8} svg.car .cap-red{fill:#c9363a}
svg.car [data-k]{cursor:pointer}
svg.car .door, svg.car .hood, svg.car .hatch{
  transform-box:view-box;transition:transform .85s cubic-bezier(.22,.9,.24,1), filter .3s;
}
svg.car .door:hover, svg.car .hood:hover, svg.car .hatch:hover{filter:brightness(1.12)}
svg.car .hood{transform-origin:392px 130px}
svg.car .hatch{transform-origin:150px 130px}
svg.car .ap{opacity:0;transition:opacity .25s .55s}
svg.car.o-fl .d-fl, svg.car.o-fr .d-fr, svg.car.o-rl .d-rl, svg.car.o-rr .d-rr{transform:rotate(var(--a))}
svg.car.o-hood .hood{transform:scaleX(.36)}
svg.car.o-trunk .hatch{transform:scaleX(.3)}
svg.car.o-fl .ap-fl, svg.car.o-fr .ap-fr, svg.car.o-rl .ap-rl, svg.car.o-rr .ap-rr,
svg.car.o-hood .ap-hood, svg.car.o-trunk .ap-trunk{opacity:1;transition-delay:0s}

/* ---------- vehicle ---------- */
.veh-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;flex:1;min-height:0}
.veh-grid .stage{min-height:250px}
.vpanel{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px}
.vp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 4px}
.vp-head h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:.02em}
.vp-head .l{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.orow{
  display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:12px;
  padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid transparent;width:100%;transition:border-color .2s, background .2s;
}
.orow svg{width:19px;height:19px;color:var(--muted)}
.orow .on{font-size:14px;font-weight:500}
.orow .ov{font-family:var(--font-label);font-size:12.5px;color:var(--muted)}
.orow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.orow[aria-pressed="true"] svg,.orow[aria-pressed="true"] .ov{color:var(--accent)}
.note{margin:4px 2px 0;font-size:12px;color:var(--faint);line-height:1.45;max-width:68ch}

/* ---------- maintenance ---------- */
.summary{display:flex;gap:8px;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%, 290px), 1fr));gap:10px}
.mcard{
  display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;padding:13px 14px;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;transition:border-color .2s, transform .15s;
}
.mcard:hover{border-color:var(--faint)}
.mcard:active{transform:scale(.99)}
.mi{width:40px;height:40px}
.mi svg{width:21px;height:21px}
.mbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.mtop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.mtop b{font-weight:600;font-size:14.5px;line-height:1.3}
.mint{font-size:12px;color:var(--muted)}
.bar{display:block;height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:7px 0 5px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--c);min-width:4px}
.bar.unk{background:repeating-linear-gradient(-45deg, var(--line) 0 5px, transparent 5px 10px)}
.bar.unk i{display:none}
.mfoot{font-size:12.5px;color:var(--muted);line-height:1.4}
.mfoot strong{color:var(--c);font-weight:600}

/* ---------- carnet ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.total{font-size:13px;color:var(--muted)}
.total b{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--fg);margin-left:4px;font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lrow{
  display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;align-items:center;gap:12px;
  padding:10px 10px 10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
}
.ldate{display:flex;flex-direction:column;align-items:center;line-height:1;padding:4px 0;border-right:1px solid var(--line)}
.ldate b{font-family:var(--font-display);font-size:24px;font-weight:600}
.ldate small{font-size:11px;color:var(--muted);margin-top:3px;text-align:center}
.lmain{min-width:0}
.lmain b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.lmain small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.lcost{font-family:var(--font-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.lx{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--faint)}
.lx:hover{color:var(--crit);background:var(--panel2)}
.lx svg{width:18px;height:18px}
.lx.confirm{width:auto;padding:0 10px;color:var(--on-accent);background:var(--crit);font-size:12.5px;font-weight:600}
.empty{
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;
  padding:22px;border:1px dashed var(--line);border-radius:18px;background:var(--panel);
}
.empty svg{width:56px;height:56px;color:var(--faint)}
.empty h3{margin:0 0 4px;font-family:var(--font-display);font-weight:600;font-size:21px}
.empty p{margin:0;color:var(--muted);font-size:13.5px;max-width:60ch}

/* ---------- fiche ---------- */
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%, 270px), 1fr));gap:10px}
.spec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px 10px}
.spec h3{margin:0 0 6px;font-family:var(--font-label);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.spec dl{margin:0}
.spec dl > div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid var(--line)}
.spec dl > div:first-child{border-top:0}
.spec dt{color:var(--muted);font-size:13px;flex-shrink:0}
.spec dd{margin:0;text-align:right;font-weight:600;font-size:13.5px;min-width:0}
.spec.cg dt{font-family:var(--font-label);font-weight:600;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:1px 8px;font-size:12px;min-width:42px;text-align:center}
.spec.cg dd{font-weight:500;color:var(--muted)}
.spec .big{font-family:var(--font-display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- controls ---------- */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.seg button{height:34px;padding:0 13px;border-radius:9px;color:var(--muted);font-size:13.5px;font-weight:600;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 0 var(--line), 0 4px 12px -6px rgba(0,0,0,.4)}
.seg-sm{background:var(--panel);}
.seg-sm button{height:28px;padding:0 10px;font-size:12px}
.seg-sm button[aria-pressed="true"]{background:var(--panel2)}
.btn{height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:filter .2s, transform .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--panel2);border:1px solid var(--line)}
.btn-danger{background:var(--panel2);border:1px solid var(--line);color:var(--crit)}
.btn-danger.confirm{background:var(--crit);color:#fff;border-color:transparent}
.switch{position:relative;width:52px;height:30px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);flex-shrink:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .25s, background .2s}
.switch[aria-checked="true"]{background:var(--accent);border-color:transparent}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--on-accent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);position:relative;box-shadow:inset 0 -6px 10px rgba(0,0,0,.35), inset 0 6px 10px rgba(255,255,255,.18)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft), inset 0 -6px 10px rgba(0,0,0,.35), inset 0 6px 10px rgba(255,255,255,.18)}

/* ---------- settings ---------- */
.rg-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%, 320px), 1fr));gap:10px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-family:var(--font-label);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px}
.set > div{min-width:0}
.set b{display:block;font-weight:600;font-size:14px}
.set small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:13.5px;line-height:1.4}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display);font-weight:700;font-size:15px}
.sync{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--muted)}
.sync .dot{margin-top:6px}

/* ---------- forms / sheet ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input,.field select{
  height:46px;padding:0 13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
  font-size:16px;width:100%;min-width:0;font-variant-numeric:tabular-nums;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.big input{height:60px;font-family:var(--font-display);font-size:30px;font-weight:600}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form{display:flex;flex-direction:column;gap:12px}
.form-title{margin:4px 0 0;font-family:var(--font-label);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.err{margin:0;font-size:13px;color:var(--crit);font-weight:500}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
details.adv{border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.adv summary{cursor:pointer;padding:11px 0;font-size:13.5px;font-weight:600;color:var(--muted);list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:"+";float:right;color:var(--faint)}
details.adv[open] summary::after{content:"–"}
details.adv > div,details.adv > p{margin-bottom:12px}

#sheet{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  opacity:0;transition:opacity .2s;
}
#sheet.in{opacity:1}
.sheet{
  width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:22px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6);transform:translateY(10px);transition:transform .25s;outline:none;
}
#sheet.in .sheet{transform:none}
.sh-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.sh-head h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.05}
.sh-head .mi{width:44px;height:44px}
.x{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--panel2)}
.x svg{width:18px;height:18px}
.state-line{margin:0;display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.state-line .pill{margin-top:1px}

.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:60;
  transform:translate(-50%, 10px);opacity:0;pointer-events:none;
  background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;
  transition:opacity .2s, transform .2s;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);
}
.toast.in{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (min-width:700px) and (min-height:560px){
  .rail .rl{display:block}
  .rail button{width:56px;min-height:56px}
  .app{grid-template-columns:74px minmax(0,1fr)}
}
@media (max-width:699px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:10px}
  .rail{order:2;flex-direction:row;justify-content:space-around;padding:6px;border-radius:20px;overflow:visible}
  .rail-mark{display:none}
  .rail button{width:auto;flex:1;min-height:50px}
  .rail .rl{display:block}
  .home-grid,.veh-grid{grid-template-columns:minmax(0,1fr)}
  .home-right{order:-1}
  .stage{flex:none;aspect-ratio:16/11;min-height:0}

  .vhead h1{font-size:29px}
  .clock{font-size:36px}
  .empty{grid-template-columns:minmax(0,1fr)}
  .lrow{grid-template-columns:56px minmax(0,1fr) auto}

}

@media (max-height:430px) and (min-width:700px){
  .vhead h1{font-size:28px}
  .clock{font-size:38px}
  .tval{font-size:25px}
  .tile{padding:10px 12px}
  .app{padding-block:8px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important;transition-delay:0s !important;animation:none !important}
}

<body>


<div class="app">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="main" id="main">
    <section class="view" id="v-home">
      <header class="vhead" id="home-head"></header>
      <div class="home-grid">
        <div class="home-left">
          <div class="tiles" id="home-tiles"></div>
          <div class="alerts" id="home-alerts"></div>
        </div>
        <div class="home-right">
          <div class="stage" data-car="h"></div>
          <p class="stage-cap" id="home-cap"></p>
        </div>
      </div>
    </section>

    <section class="view" id="v-vehicle" hidden>
      <header class="vhead" id="veh-head"></header>
      <div class="veh-grid">
        <div class="stage" data-car="v"></div>
        <div class="vpanel" id="veh-panel"></div>
      </div>
    </section>

    <section class="view" id="v-entretien" hidden>
      <header class="vhead" id="ent-head"></header>
      <div class="summary" id="ent-summary"></div>
      <div class="mgrid" id="ent-grid"></div>
      <p class="note">Intervalles indicatifs pour un 1.5 dCi K9K de cet âge. Ton carnet Renault et ton garagiste font foi, et chaque intervalle se modifie en touchant la ligne.</p>
    </section>

    <section class="view" id="v-carnet" hidden>
      <header class="vhead" id="log-head"></header>

function defaults(){

function normalize(s){
  const d = defaults();
  if (!s || typeof s !== 'object') return d;
  const o = Object.assign({}, d, s);
  o.items = {};
  for (const id in d.items) o.items[id] = Object.assign({}, d.items[id], (s.items && s.items[id]) || {});
  o.log = Array.isArray(s.log) ? s.log.filter(x => x && typeof x === 'object') : [];
  if (!VERSIONS[o.version]) o.version = '90';
  if (o.doors !== 3 && o.doors !== 5) o.doors = 5;
  if (!PAINTS.some(p => p.id === o.paint)) o.paint = 'gris';
  return o;
}

/* ================= persistence ================= */
let sync = 'local', dbRef = null, writing = false, pending = false, writeTimer = null;

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
  if (dbRef){ clearTimeout(writeTimer); writeTimer = setTimeout(flush, 700); }
}
async function flush(){
  if (!dbRef) return;
  if (writing){ pending = true; return; }
  writing = true;
  try { await dbRef.set({state: JSON.parse(JSON.stringify(state)), updatedAt: Date.now()}); sync = 'cloud'; }
  catch(e){ sync = 'cloud-error'; }
  writing = false;
  renderSync();
  if (pending){ pending = false; flush(); }
}
function hasData(s){
  return s.km != null || s.log.length > 0 || Object.values(s.items).some(i => i.known);
}
async function initDb(){
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/garage');
    const snap = await Promise.race([
      ref.get(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))
    ]);
    dbRef = ref;
    const d = snap.exists ? snap.data() : null;
    sync = 'cloud';
    if (d && d.state){
      state = normalize(d.state);
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
      applyTheme(); buildStages(); renderAll();
    } else {
      if (hasData(state)) flush();
      renderSync();
    }
  } catch(e) { /* stays on this device */ }
}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('fr-FR');
const fmtKm = (n) => nf.format(Math.round(n));
const eur = (n) => new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR', maximumFractionDigits: Number.isInteger(n) ? 0 : 2}).format(n);
const pad = (n) => String(n).padStart(2, '0');
const isoToday = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
const parseISO = (s) => { if (!s || typeof s !== 'string') return null; const [y,m,d] = s.split('-').map(Number); return y ? new Date(y, (m||1)-1, d||1) : null; };
const addMonths = (dt, n) => new Date(dt.getFullYear(), dt.getMonth() + n, dt.getDate());
const DAY = 86400000;
const fmtDate = (d, opt) => { const x = d instanceof Date ? d : parseISO(d); return x ? x.toLocaleDateString('fr-FR', opt || {day:'numeric', month:'long', year:'numeric'}) : ''; };
const fmtShort = (d) => fmtDate(d, {day:'numeric', month:'short', year:'numeric'});
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function dur(days){
  const a = Math.abs(days);
  if (a >= 60){ const m = Math.round(a / 30.44); return m + ' mois'; }
  return Math.max(1, Math.round(a)) + ' j';
}

function interval(it){
  const st = state.items[it.id];
  return { km: st.intKm != null ? st.intKm : it.intKm, m: st.intM != null ? st.intM : it.intM };
}
function monthsLabel(m){ return m % 12 === 0 ? (m === 12 ? '1 an' : (m/12) + ' ans') : m + ' mois'; }
function intervalLabel(it, iv){
  iv = iv || interval(it);
  if (iv.km && iv.m) return 'Tous les ' + fmtKm(iv.km) + ' km ou ' + monthsLabel(iv.m);
  if (iv.km) return 'Contrôle tous les ' + fmtKm(iv.km) + ' km';
  if (iv.m) return iv.m === 12 ? 'Chaque année' : 'Tous les ' + monthsLabel(iv.m);
  return 'Contrôle régulier';
}

function status(it){
  const st = state.items[it.id], iv = interval(it);
  const today = new Date(); today.setHours(0,0,0,0);
  if (!st.known) return {code:'unknown', hi: it.prio <= 1, label:'Inconnue', text: it.tip, short:'Historique inconnu', ratio:null, rawRatio:0};
  let ratio = null, remKm = null, remDays = null, due = null;
  if (iv.km && st.lastKm != null && state.km != null){
    remKm = st.lastKm + iv.km - state.km;
    ratio = Math.max(ratio || 0, (state.km - st.lastKm) / iv.km);
  }
  const ld = parseISO(st.lastDate);
  if (iv.m && ld){
    due = addMonths(ld, iv.m);
    remDays = (due - today) / DAY;
    const total = (due - ld) / DAY;
    ratio = Math.max(ratio || 0, ((today - ld) / DAY) / total);
  }
  if (ratio === null){
    const t = (iv.km && state.km == null) ? 'Ajoute ton kilométrage actuel pour calculer l’échéance.' : 'Ajoute la date ou le kilométrage du dernier passage.';
    return {code:'unknown', hi:false, label:'À compléter', text:t, short:'À compléter', ratio:null, rawRatio:0};
  }
  const parts = [];
  if (remKm != null){
    if (remKm < 0) parts.push('dépassé de ' + fmtKm(-remKm) + ' km');
    else if (remKm < 100) parts.push('dans moins de 100 km');
    else parts.push('dans ' + fmtKm(Math.round(remKm / 100) * 100) + ' km');
  }
  if (remDays != null){
    if (remDays < 0) parts.push('en retard de ' + dur(remDays));
    else if (remDays < 1) parts.push('aujourd’hui');
    else parts.push('dans ' + dur(remDays));
  }
  const over = ratio >= 1 || (remKm != null && remKm < 0) || (remDays != null && remDays < 0);
  const soon = !over && (ratio >= 0.9 || (remKm != null && remKm <= 1500) || (remDays != null && remDays <= 45));
  const code = over ? 'over' : soon ? 'soon' : 'ok';
  const text = parts.join(' · ');
  return {code, hi:false, label: over ? 'Dépassé' : soon ? 'Bientôt' : 'À jour', text: cap(text), short: cap(text),
          ratio: Math.min(ratio, 1), rawRatio: ratio, remKm, remDays, due};
}
const sClass = (s) => 's-' + (s.code === 'unknown' && s.hi ? 'unknownhi' : s.code);

function ranked(){
  const sev = {over:0, soon:1, unknown:2, ok:3};
  return ITEMS.map(it => ({it, s: status(it)})).sort((a, b) =>

    (a.s.code === 'unknown' ? a.it.prio - b.it.prio : (b.s.rawRatio || 0) - (a.s.rawRatio || 0)));
}

  const st = state.items[it.id], p = [];
  if (st.lastKm != null) p.push(fmtKm(st.lastKm) + ' km');

}

function buildStages(){
  $$('[data-car]').forEach(st => {
    const p = 'c' + st.dataset.car;
    const rz = st.dataset.rz != null ? st.dataset.rz : (ui.view3d ? -20 : 0);
    st.dataset.rz = rz;
    st.innerHTML = `<div class="car-wrap" style="--rz:${rz}deg"><div class="floor"></div>${carSVG(p)}</div>
      <div class="stage-ui"><div class="seg seg-sm" role="group" aria-label="Vue de la voiture">
        <button type="button" data-view3d="1">3D</button><button type="button" data-view3d="0">Dessus</button>
      </div></div>
      <p class="stage-hint">Glisse pour tourner · touche une porte</p>`;
    bindDrag(st);
  });
  applyOpen(); applyView();
}
function applyOpen(){
  if (state.doors === 3){ ui.open.rl = false; ui.open.rr = false; }
  $$('svg.car').forEach(svg => OPENINGS.forEach(o => svg.classList.toggle('o-' + o.k, !!ui.open[o.k])));
}
function applyView(){
  $$('[data-car]').forEach(st => st.classList.toggle('flat', !ui.view3d));
  $$('[data-view3d]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.view3d === '1') === ui.view3d)));
}
function bindDrag(st){
  if (st.dataset.bound) return;
  st.dataset.bound = '1';
  let sx = 0, sr = 0, down = false, moved = false, pid = null;
  st.addEventListener('pointerdown', e => {
    if (e.target.closest('.stage-ui')) return;
    down = true; moved = false; sx = e.clientX; sr = parseFloat(st.dataset.rz) || 0; pid = e.pointerId;
  });
  st.addEventListener('pointermove', e => {
    if (!down || e.pointerId !== pid) return;
    const dx = e.clientX - sx;
    if (!moved && Math.abs(dx) > 6){
      moved = true; st.classList.add('dragging');
      try { st.setPointerCapture(pid); } catch(_) {}
    }
    if (moved){
      const rz = Math.max(-75, Math.min(75, sr + dx * 0.32));
      st.dataset.rz = rz.toFixed(1);
      const w = st.querySelector('.car-wrap'); if (w) w.style.setProperty('--rz', rz.toFixed(1) + 'deg');
    }
  });
  const end = () => {
    if (!down) return;
    down = false; st.classList.remove('dragging');
    if (moved){ st.dataset.dragged = '1'; setTimeout(() => { delete st.dataset.dragged; }, 80); }
  };
  st.addEventListener('pointerup', end);
  st.addEventListener('pointercancel', end);
  st.addEventListener('click', e => { if (st.dataset.dragged){ e.stopPropagation(); e.preventDefault(); } }, true);
}
function setView3d(on){
  ui.view3d = on;
  $$('[data-car]').forEach(st => {
    st.dataset.rz = on ? -20 : 0;
    const w = st.querySelector('.car-wrap'); if (w) w.style.setProperty('--rz', st.dataset.rz + 'deg');
  });
  applyView();
}
function toggleOpen(k){
  if (state.doors === 3 && (k === 'rl' || k === 'rr')) return;
  ui.open[k] = !ui.open[k];
  applyOpen(); renderVehPanel(); renderHomeCap();
}

    <section class="card">
      <h2>Sauvegarde</h2>
      <div class="sync" id="sync-line">${syncHtml}</div>
      <div class="set"><div><b>Copie de sécurité</b><small>Un fichier à garder dans l’app Fichiers.</small></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button type="button" class="btn btn-ghost" data-act="export">Exporter</button><button type="button" class="btn btn-ghost" data-act="import">Importer</button></div></div>
      <input type="file" id="imp" accept=".json,application/json" hidden>
      <div class="set"><div><b>Effacer mes données</b><small>Kilométrage, entretien et carnet repartent à zéro.</small></div><button type="button" class="btn btn-danger" data-act="reset">Effacer</button></div>
    </section>
  </div>`;
  const imp = $('#imp');
  if (imp) imp.addEventListener('change', () => {
    const file = imp.files && imp.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const obj = JSON.parse(rd.result);
        if (!obj || !obj.state) throw new Error('format');
        state = normalize(obj.state); save(); applyTheme(); buildStages(); renderAll(); toast('Sauvegarde importée');
      } catch(e){ toast('Ce fichier n’est pas une sauvegarde Ma Clio'); }
    };
    rd.readAsText(file);
  });
  const nameIn = $('#rg-name');
  let nt = null;
  nameIn.addEventListener('input', () => {
    state.name = nameIn.value.trim().slice(0, 24);
    clearTimeout(nt); nt = setTimeout(() => { save(); renderHome(); }, 400);
  });
}
function syncLine(){
  if (sync === 'cloud') return `<span class="dot s-ok"></span><span>Enregistré sur ton compte Claude. Tu retrouves tes données depuis n’importe quel appareil.</span>`;
  if (sync === 'cloud-error') return `<span class="dot s-soon"></span><span>La sauvegarde en ligne n’a pas abouti. Tes données restent sur cet appareil et repartiront au prochain changement.</span>`;
  return `<span class="dot s-ok"></span><span>Enregistré sur ce téléphone. Exporte une sauvegarde de temps en temps pour ne rien perdre si tu changes d’iPhone.</span>`;
}
function renderSync(){ const el = $('#sync-line'); if (el) el.innerHTML = syncLine(); }

function renderAll(){
  renderRail(); renderHome(); renderVehHead(); renderVehPanel(); renderEntretien(); renderCarnet(); renderFiche(); renderReglages();
  setTab(ui.tab);
}

/* ================= sheets ================= */
const sheet = $('#sheet');
let lastFocus = null;
function openSheet(html, mount){
  lastFocus = document.activeElement;
  sheet.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" tabindex="-1">${html}</div>`;
  sheet.hidden = false;
  requestAnimationFrame(() => sheet.classList.add('in'));
  const box = sheet.firstElementChild;
  if (mount) mount(box);
  box.focus({preventScroll:true});
}
function closeSheet(){
  sheet.classList.remove('in');
  sheet.hidden = true; sheet.innerHTML = '';
  if (lastFocus && lastFocus.isConnected && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
sheet.addEventListener('click', e => { if (e.target === sheet || e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
const closeBtn = `<button type="button" class="x" data-close aria-label="Fermer">${ic('x')}</button>`;

function showErr(box, msg){ const e = box.querySelector('.err'); if (e){ e.textContent = msg; e.hidden = false; } }
function parseNum(v){ if (v == null) return null; const s = String(v).replace(/\s/g, '').replace(',', '.'); if (s === '') return null; const n = Number(s); return Number.isFinite(n) ? n : NaN; }

function openKm(){
  openSheet(`<div class="sh-head"><span class="mi s-ok" style="--c:var(--accent)">${ic('car')}</span><div><p class="eyebrow">Compteur</p><h2>Kilométrage actuel</h2></div>${closeBtn}</div>
    <form class="form" id="f-km" novalidate>
      <label class="field big"><span>Kilométrage affiché au compteur</span><input id="fk" type="number" inputmode="numeric" min="0" max="999999" step="1" placeholder="ex. 184500" value="${state.km != null ? state.km : ''}"></label>
      <p class="hint">Mets-le à jour de temps en temps : c’est lui qui calcule les échéances en kilomètres.</p>
      <p class="err" hidden></p>
      <div class="actions"><button type="button" class="btn btn-ghost" data-close>Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button></div>
    </form>`, box => {
    box.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      const v = parseNum(box.querySelector('#fk').value);
      if (v == null || Number.isNaN(v) || v < 0 || v > 999999){ showErr(box, 'Entre le nombre affiché au compteur, sans espace, par exemple 184500.'); return; }
      state.km = Math.round(v); state.kmDate = isoToday();
      save(); closeSheet(); renderAll(); toast('Kilométrage enregistré');
    });
  });
}

function openItem(id){
  const it = ITEM[id]; if (!it) return;
  const st = state.items[id], s = status(it), iv = interval(it);
  const hasKm = it.intKm != null, hasM = it.intM != null;
  openSheet(`<div class="sh-head"><span class="mi ${sClass(s)}">${ic(it.icon)}</span><div><p class="eyebrow">${esc(intervalLabel(it))}</p><h2>${esc(it.name)}</h2></div>${closeBtn}</div>
    <p class="state-line ${sClass(s)}"><span class="pill">${esc(s.label)}</span><span>${esc(s.text)}</span></p>
    ${it.note ? `<p class="hint">${esc(it.note)}</p>` : ''}
    <form class="form" id="f-item" novalidate>
      <p class="form-title">Dernier passage</p>
      <div class="row2">
        <label class="field"><span>Date</span><input id="fi-date" type="date" max="${isoToday()}" value="${esc(st.lastDate || isoToday())}"></label>
        ${hasKm ? `<label class="field"><span>Kilométrage à ce moment</span><input id="fi-km" type="number" inputmode="numeric" min="0" step="1" placeholder="ex. 172000" value="${st.lastKm != null ? st.lastKm : (state.km != null ? state.km : '')}"></label>` : ''}
      </div>
      <details class="adv"><summary>Modifier l’intervalle</summary>
        <div class="row2">
          ${hasKm ? `<label class="field"><span>Tous les (km)</span><input id="fi-ikm" type="number" inputmode="numeric" min="1000" step="500" value="${iv.km}"></label>` : ''}
          ${hasM ? `<label class="field"><span>${hasKm ? 'Ou tous les (mois)' : 'Tous les (mois)'}</span><input id="fi-im" type="number" inputmode="numeric" min="1" max="120" step="1" value="${iv.m}"></label>` : ''}
        </div>
        <p class="hint">Par défaut : ${esc(intervalLabel(it, {km: it.intKm, m: it.intM}).toLowerCase())}.</p>
      </details>
      <p class="err" hidden></p>
      <div class="actions">
        ${st.known ? '<button type="button" class="btn btn-ghost" data-unknown>Remettre en inconnu</button>' : ''}
        <button type="submit" class="btn btn-primary">${st.known ? 'Enregistrer' : 'C’est fait'}</button>
      </div>
    </form>`, box => {
    const f = box.querySelector('form');
    const u = box.querySelector('[data-unknown]');
    if (u) u.addEventListener('click', () => {
      Object.assign(state.items[id], {known:false, lastKm:null, lastDate:null});
      save(); closeSheet(); renderAll(); toast(it.short + ' : historique remis à zéro');
    });
    f.addEventListener('submit', e => {
      e.preventDefault();
      const date = box.querySelector('#fi-date').value || null;
      const kmv = hasKm ? parseNum(box.querySelector('#fi-km').value) : null;
      if (Number.isNaN(kmv) || (kmv != null && (kmv < 0 || kmv > 999999))){ showErr(box, 'Le kilométrage doit être un nombre, sans espace.'); return; }
      if (!date && kmv == null){ showErr(box, 'Indique au moins la date ou le kilométrage.'); return; }
      if (date && date > isoToday()){ showErr(box, 'La date ne peut pas être dans le futur.'); return; }
      const ikm = hasKm ? parseNum(box.querySelector('#fi-ikm').value) : null;
      const im = hasM ? parseNum(box.querySelector('#fi-im').value) : null;
      if ((hasKm && (ikm == null || Number.isNaN(ikm) || ikm < 1000)) || (hasM && (im == null || Number.isNaN(im) || im < 1))){
        showErr(box, 'L’intervalle doit être d’au moins 1 000 km et 1 mois.'); return;
      }
      const sti = state.items[id];
      const wasSame = sti.known && sti.lastDate === date && sti.lastKm === (kmv != null ? Math.round(kmv) : null);
      sti.known = true; sti.lastDate = date; sti.lastKm = kmv != null ? Math.round(kmv) : null;
      sti.intKm = hasKm && ikm !== it.intKm ? Math.round(ikm) : null;
      sti.intM = hasM && im !== it.intM ? Math.round(im) : null;
      if (sti.lastKm != null && (state.km == null || (date === isoToday() && sti.lastKm > state.km))){
        if (state.km == null || sti.lastKm > state.km){ state.km = sti.lastKm; state.kmDate = date || isoToday(); }
      }
      if (!wasSame && !state.log.some(x => x.itemId === id && x.date === date)){
        state.log.push({id: uid(), itemId: id, title: it.name, date, km: sti.lastKm, cost: null, note: ''});
      }
      save(); closeSheet(); renderAll(); toast(it.short + ' enregistré' + (it.id === 'vidange' || it.id === 'distri' ? 'e' : ''));
    });
  });
}

function openLog(){
  openSheet(`<div class="sh-head"><span class="mi" style="--c:var(--accent)">${ic('receipt')}</span><div><p class="eyebrow">Carnet</p><h2>Nouvelle intervention</h2></div>${closeBtn}</div>
    <form class="form" id="f-log" novalidate>
      <label class="field"><span>Intervention</span><select id="fl-type">${ITEMS.map(i => `<option value="${i.id}">${esc(i.name)}</option>`).join('')}<option value="autre">Autre intervention</option></select></label>
      <label class="field" id="fl-title-wrap" hidden><span>Intitulé</span><input id="fl-title" type="text" maxlength="60" placeholder="ex. Remplacement batterie"></label>
      <div class="row2">
        <label class="field"><span>Date</span><input id="fl-date" type="date" max="${isoToday()}" value="${isoToday()}"></label>
        <label class="field"><span>Kilométrage</span><input id="fl-km" type="number" inputmode="numeric" min="0" step="1" placeholder="facultatif" value="${state.km != null ? state.km : ''}"></label>
      </div>
      <div class="row2">
        <label class="field"><span>Prix (€)</span><input id="fl-cost" type="text" inputmode="decimal" placeholder="facultatif"></label>
        <label class="field"><span>Garage ou note</span><input id="fl-note" type="text" maxlength="80" placeholder="facultatif"></label>
      </div>
      <p class="hint">Si tu choisis un entretien de la liste, son échéance se met à jour.</p>
      <p class="err" hidden></p>
      <div class="actions"><button type="button" class="btn btn-ghost" data-close>Annuler</button><button type="submit" class="btn btn-primary">Ajouter</button></div>
    </form>`, box => {
    const sel = box.querySelector('#fl-type'), tw = box.querySelector('#fl-title-wrap');
    sel.addEventListener('change', () => { tw.hidden = sel.value !== 'autre'; });
    box.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      const type = sel.value;
      const title = type === 'autre' ? box.querySelector('#fl-title').value.trim() : ITEM[type].name;
      const date = box.querySelector('#fl-date').value;
      const kmv = parseNum(box.querySelector('#fl-km').value);
      const cost = parseNum(box.querySelector('#fl-cost').value.replace('€', ''));
      const note = box.querySelector('#fl-note').value.trim();
      if (!title){ showErr(box, 'Donne un intitulé à cette intervention.'); return; }
      if (!date){ showErr(box, 'Indique la date de l’intervention.'); return; }
      if (date > isoToday()){ showErr(box, 'La date ne peut pas être dans le futur.'); return; }
      if (Number.isNaN(kmv) || (kmv != null && kmv < 0)){ showErr(box, 'Le kilométrage doit être un nombre, sans espace.'); return; }
      if (Number.isNaN(cost) || (cost != null && cost < 0)){ showErr(box, 'Le prix doit être un nombre, par exemple 89,90.'); return; }
      const km = kmv != null ? Math.round(kmv) : null;
      state.log.push({id: uid(), itemId: type === 'autre' ? null : type, title, date, km, cost: cost != null ? Math.round(cost * 100) / 100 : null, note});
      if (type !== 'autre'){
        const sti = state.items[type];
        if (!sti.known || !sti.lastDate || date >= sti.lastDate){ sti.known = true; sti.lastDate = date; sti.lastKm = km; }
      }
      if (km != null && (state.km == null || km > state.km)){ state.km = km; state.kmDate = date; }
      save(); closeSheet(); renderAll(); toast('Intervention ajoutée');
    });
  });
}

/* ================= misc ================= */
let toastT = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('in');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('in'), 2200);
}

const hostTheme = document.documentElement.getAttribute('data-theme');
function applyTheme(){
  const r = document.documentElement;
  if (state.theme === 'day') r.setAttribute('data-theme', 'light');
  else if (state.theme === 'night') r.setAttribute('data-theme', 'dark');
  else if (hostTheme) r.setAttribute('data-theme', hostTheme);
  else r.removeAttribute('data-theme');
}

let wakeSentinel = null;
async function requestWake(){
  try {
    wakeSentinel = await navigator.wakeLock.request('screen');
    wakeSentinel.addEventListener('release', () => { wakeSentinel = null; updateWakeUI(); });
    return true;
  } catch(e){ wakeSentinel = null; return false; }
}
function updateWakeUI(msg){
  const sw = $('[data-act="wake"]'); if (sw) sw.setAttribute('aria-checked', String(!!wakeSentinel));
  if (msg){ const m = $('#wake-msg'); if (m) m.textContent = msg; }
}
async function toggleWake(){
  if (!('wakeLock' in navigator)) return;
  if (wakeSentinel){ try { await wakeSentinel.release(); } catch(e) {} wakeSentinel = null; state.wake = false; save(); updateWakeUI('Évite que l’iPhone se mette en veille pendant la recopie.'); return; }
  const ok = await requestWake();
  state.wake = ok; save();
  updateWakeUI(ok ? 'L’écran reste allumé tant que la page est ouverte.' : 'L’appareil a refusé : garde l’écran allumé dans les réglages de l’iPhone.');
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.wake && !wakeSentinel && 'wakeLock' in navigator) requestWake().then(() => updateWakeUI());
});

let resetArmed = null;
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#sheet')) return;
  const part = t.closest('svg.car [data-k]');
  if (part){ toggleOpen(part.dataset.k); return; }
  const b = t.closest('[data-tab],[data-item],[data-act],[data-open],[data-view3d],[data-version],[data-doors],[data-paint],[data-themeset],[data-del]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.tab){ setTab(d.tab); return; }
  if (d.item){ openItem(d.item); return; }
  if (d.open){ toggleOpen(d.open); return; }
  if (d.view3d != null){ setView3d(d.view3d === '1'); return; }
  if (d.version){ state.version = d.version; save(); renderAll(); return; }
  if (d.doors){ state.doors = Number(d.doors); save(); buildStages(); renderAll(); return; }
  if (d.paint){ state.paint = d.paint; save(); buildStages(); renderAll(); return; }
  if (d.themeset){ state.theme = d.themeset; save(); applyTheme(); renderReglages(); return; }
  if (d.del){
    if (b.classList.contains('confirm')){
      state.log = state.log.filter(x => x.id !== d.del); save(); renderCarnet(); toast('Intervention supprimée');
    } else {
      $$('.lx.confirm').forEach(x => { x.classList.remove('confirm'); x.innerHTML = ic('trash'); });
      b.classList.add('confirm'); b.textContent = 'Supprimer ?';
      setTimeout(() => { if (b.isConnected && b.classList.contains('confirm')){ b.classList.remove('confirm'); b.innerHTML = ic('trash'); } }, 3500);
    }
    return;
  }
  switch (d.act){
    case 'km': openKm(); break;
    case 'add-log': openLog(); break;
    case 'close-all': OPENINGS.forEach(o => ui.open[o.k] = false); applyOpen(); renderVehPanel(); renderHomeCap(); break;
    case 'wake': toggleWake(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify({app:'clio-launcher', v:1, savedAt:new Date().toISOString(), state}, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'clio-sauvegarde-' + isoToday() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('Sauvegarde exportée');
      break;
    }
    case 'import': { const f = $('#imp'); if (f) f.click(); break; }
    case 'reset':
      if (resetArmed){
        clearTimeout(resetArmed); resetArmed = null;
        const keep = {theme: state.theme, paint: state.paint, doors: state.doors, version: state.version, name: state.name};
        state = Object.assign(defaults(), keep); save(); renderAll(); toast('Données effacées');
      } else {
        b.classList.add('confirm'); b.textContent = 'Confirmer';
        resetArmed = setTimeout(() => { resetArmed = null; if (b.isConnected){ b.classList.remove('confirm'); b.textContent = 'Effacer'; } }, 4000);
      }
      break;
  }
});

function tick(){
  const c = clockText();
  $$('[data-clock]').forEach(el => { if (el.textContent !== c) el.textContent = c; });
  const g = $('#home-head h1');
  if (g){ const want = esc(greeting()) + (state.name ? ', ' + esc(state.name) : ''); if (g.innerHTML !== want) renderHome(); }
}

/* ================= boot ================= */
applyTheme();
buildStages();
renderAll();
setInterval(tick, 10000);
if (state.wake && 'wakeLock' in navigator) requestWake().then(() => updateWakeUI());
})();
</script>

</body>
</html>
